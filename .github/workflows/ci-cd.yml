name: Test and deploy

# Pull request to main  -> build the containers and run the tests.
# Merge (push) to main  -> same checks, then publish the images and deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build containers and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shopfest-backend ./backend

      - name: Run backend tests inside the container
        run: docker run --rm shopfest-backend python manage.py test

      - name: Check for missing migrations
        run: docker run --rm shopfest-backend python manage.py makemigrations --check --dry-run

      - name: Build frontend image
        run: docker build -t shopfest-frontend ./frontend

  deploy:
    name: Publish images and deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
      FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image names (must be lower case)
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Publish backend image
        run: |
          docker build -t "$IMAGE_PREFIX/backend:latest" -t "$IMAGE_PREFIX/backend:${GITHUB_SHA}" ./backend
          docker push --all-tags "$IMAGE_PREFIX/backend"

      - name: Publish frontend image
        run: |
          docker build --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
            -t "$IMAGE_PREFIX/frontend:latest" -t "$IMAGE_PREFIX/frontend:${GITHUB_SHA}" ./frontend
          docker push --all-tags "$IMAGE_PREFIX/frontend"

      # The host redeploys when its deploy hook is called. Hooks are stored as
      # repository secrets; until they are added these steps are skipped.
      - name: Deploy backend
        if: env.BACKEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$BACKEND_DEPLOY_HOOK"

      - name: Deploy frontend
        if: env.FRONTEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$FRONTEND_DEPLOY_HOOK"
