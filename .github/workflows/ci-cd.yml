name: Test and deploy

# Pull request to main  -> build the containers and run the tests.
# Merge (push) to main  -> same checks, then deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build containers and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t shopfest-backend ./backend

      - name: Run backend tests inside the container
        run: docker run --rm shopfest-backend python manage.py test

      - name: Check for missing migrations
        run: docker run --rm shopfest-backend python manage.py makemigrations --check --dry-run

      - name: Build frontend image
        run: docker build -t shopfest-frontend ./frontend

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
      FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
    steps:
      # The host builds each container from this repository's Dockerfile when its
      # deploy hook is called. Hooks are stored as repository secrets; until they
      # are added these steps are skipped.
      - name: Deploy backend
        if: env.BACKEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$BACKEND_DEPLOY_HOOK"

      - name: Deploy frontend
        if: env.FRONTEND_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$FRONTEND_DEPLOY_HOOK"

      - name: Note when no host is connected yet
        if: env.BACKEND_DEPLOY_HOOK == '' && env.FRONTEND_DEPLOY_HOOK == ''
        run: echo "No deploy hooks are configured, so nothing was deployed."
